<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="988 FM">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>988 FM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh}
main{text-align:center;width:min(92vw,520px);padding:28px}
.logo-wrap{width:min(82vw,400px);height:min(48vw,245px);margin:0 auto 18px;background:transparent;display:flex;align-items:center;justify-content:center;overflow:hidden}.logo{width:88%;height:88%;object-fit:contain;display:block;background:transparent}
.live{font-size:16px;opacity:.72;margin:4px 0 34px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ed174c;margin-right:7px}
button{border:0;border-radius:999px;font-size:22px;font-weight:700;padding:18px 34px;cursor:pointer;background:#ed174c;color:#fff;min-width:240px}
#status{margin-top:22px;min-height:24px;opacity:.75}
.small{font-size:13px;opacity:.42;margin-top:36px}
</style>
</head>
<body>
<main>
  <div class="logo-wrap"><img class="logo" src="988-logo-transparent.png" alt="988 FM"></div>
  <div class="live"><span class="dot"></span>LIVE · Malaysia Radio</div>
  <button id="play">▶ PLAY 988</button>
  <div id="status">Ready</div>
  <div class="small">988 FM · Live Radio</div>
  <audio id="audio" preload="auto" autoplay playsinline src="https://28103.live.streamtheworld.com/988_FMAAC.aac"></audio>
</main>
<script>
const STREAM = "https://28103.live.streamtheworld.com/988_FMAAC.aac";
const audio = document.getElementById("audio");
const btn = document.getElementById("play");
const status = document.getElementById("status");

async function playRadio() {
  try {
    await audio.play();
    btn.textContent = "⏸ PAUSE 988";
    status.textContent = "Playing 988 FM";
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "988 FM", artist: "Malaysia Live Radio", album: "988 FM"
      });
      try { navigator.mediaSession.setActionHandler("play", () => audio.play()); } catch(e){}
      try { navigator.mediaSession.setActionHandler("pause", () => audio.pause()); } catch(e){}
    }
  } catch(e) {
    status.textContent = "请按一次 PLAY 988（浏览器可能禁止自动播放）";
  }
}
btn.addEventListener("click", () => audio.paused ? playRadio() : audio.pause());
audio.addEventListener("play", () => { btn.textContent="⏸ PAUSE 988"; status.textContent="Playing 988 FM"; });
audio.addEventListener("pause", () => { btn.textContent="▶ PLAY 988"; status.textContent="Paused"; });
let reconnectTimer = null;
let reconnectDelay = 1200;
function reconnectRadio() {
  if (audio.paused) return;
  clearTimeout(reconnectTimer);
  status.textContent = "Reconnecting…";
  reconnectTimer = setTimeout(() => {
    try {
      audio.load();
      playRadio().then(() => { reconnectDelay = 1200; }).catch(() => {});
    } catch(e) {}
    reconnectDelay = Math.min(reconnectDelay * 2, 12000);
  }, reconnectDelay);
}
audio.addEventListener("error", () => reconnectRadio());
audio.addEventListener("stalled", () => reconnectRadio());
audio.addEventListener("playing", () => { reconnectDelay = 1200; status.textContent="● LIVE · Playing 988 FM"; });
window.addEventListener("load", () => { playRadio(); setTimeout(playRadio, 500); });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
