<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="988 FM">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>988 FM</title>
<style>
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#111;color:#fff;font-family:Arial,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh}
main{text-align:center;width:min(92vw,520px);padding:28px}
.logo{font-size:58px;font-weight:900;letter-spacing:-4px;color:#ef233c}
.live{font-size:15px;opacity:.75;margin:4px 0 34px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef233c;margin-right:7px}
button{border:0;border-radius:999px;font-size:22px;font-weight:700;padding:18px 34px;cursor:pointer}
#play{background:#ef233c;color:#fff;min-width:210px}
#status{margin-top:22px;min-height:24px;opacity:.75}
.small{font-size:13px;opacity:.45;margin-top:36px}
</style>
</head>
<body>
<main>
  <div class="logo">988</div>
  <div class="live"><span class="dot"></span>LIVE · Malaysia Radio</div>
  <button id="play">▶ PLAY 988</button>
  <div id="status">Ready</div>
  <div class="small">988 FM shortcut · Mobile / Tesla Browser</div>
  <audio id="audio" preload="none" playsinline></audio>
</main>
<script>
const STREAM = "https://28103.live.streamtheworld.com/988_FMAAC.aac";
const audio = document.getElementById("audio");
const btn = document.getElementById("play");
const status = document.getElementById("status");

async function playRadio() {
  if (!audio.src) audio.src = STREAM;
  try {
    await audio.play();
    btn.textContent = "⏸ PAUSE 988";
    status.textContent = "Playing 988 FM";
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "988 FM",
        artist: "Malaysia Live Radio",
        album: "988 FM"
      });
      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
    }
  } catch(e) {
    status.textContent = "请按一次 PLAY 988（浏览器可能禁止自动播放）";
  }
}
btn.addEventListener("click", () => audio.paused ? playRadio() : audio.pause());
audio.addEventListener("play", () => { btn.textContent="⏸ PAUSE 988"; status.textContent="Playing 988 FM"; });
audio.addEventListener("pause", () => { btn.textContent="▶ PLAY 988"; status.textContent="Paused"; });
audio.addEventListener("error", () => { status.textContent="Stream unavailable or unsupported."; });

window.addEventListener("load", () => {
  // Best-effort autoplay. Android browsers may require a user tap.
  playRadio();
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
</body>
</html>
