<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="988 FM">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>988 FM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.app{width:min(720px,100vw);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 6vw;gap:clamp(18px,4vh,36px)}
.logo{width:min(62vw,360px);height:min(45vh,300px);object-fit:contain;display:block}
.status{font-size:clamp(18px,3vw,28px);font-weight:700;letter-spacing:.06em}
.live{color:#f0164f}.connecting{color:#aaa}
.station{font-size:clamp(22px,4vw,32px);font-weight:700;margin-top:-10px}
button{border:0;border-radius:999px;width:min(68vw,300px);height:clamp(72px,13vw,96px);font-size:clamp(22px,4vw,32px);font-weight:800;background:#f0164f;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
.hint{font-size:clamp(13px,2.2vw,17px);color:#777;text-align:center;max-width:520px;line-height:1.4}
</style>
</head>
<body>
<main class="app" aria-label="988 FM live radio">
  <img class="logo" src="988-logo-original.png" alt="988 FM">
  <div id="status" class="status connecting">CONNECTING…</div>
  <div class="station">988 FM</div>
  <button id="play" type="button">▶ PLAY 988</button>
  <div id="hint" class="hint">If automatic playback is blocked, tap PLAY once.</div>
  <audio id="audio" preload="none" playsinline></audio>
</main>
<script>
(() => {
  // Current working HTTPS stream identified for 988 FM.
  const STREAM = "https://28103.live.streamtheworld.com/988_FMAAC.aac";
  const audio = document.getElementById("audio");
  const play = document.getElementById("play");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");
  audio.src = STREAM;

  const ui = (text, cls="") => { status.textContent=text; status.className="status "+cls; };
  const playingUI = () => {
    play.textContent = "❚❚ PAUSE 988";
    ui("● LIVE","live");
    hint.textContent = "Playing 988 FM";
  };
  const pausedUI = () => {
    play.textContent = "▶ PLAY 988";
    ui("READY","");
    hint.textContent = "Tap PLAY once to start 988 FM.";
  };

  async function start() {
    ui("CONNECTING…","connecting");
    try {
      await audio.play();
      playingUI();
    } catch (e) {
      pausedUI();
    }
  }
  function stop() {
    audio.pause();
    pausedUI();
  }
  play.addEventListener("click", () => audio.paused ? start() : stop());

  audio.addEventListener("playing", playingUI);
  audio.addEventListener("waiting", () => { if (!audio.paused) ui("BUFFERING…","connecting"); });
  audio.addEventListener("pause", () => { if (!audio.ended) { play.textContent="▶ PLAY 988"; } });

  let timer = null, delay = 1500;
  function reconnect() {
    clearTimeout(timer);
    if (audio.paused) return;
    ui("RECONNECTING…","connecting");
    timer = setTimeout(async () => {
      try {
        audio.load();
        await audio.play();
        delay = 1500;
      } catch (e) {
        delay = Math.min(delay * 2, 15000);
        reconnect();
      }
    }, delay);
  }
  audio.addEventListener("stalled", reconnect);
  audio.addEventListener("error", reconnect);

  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title:"988 FM", artist:"988 FM Malaysia", album:"Live Radio"
    });
    try { navigator.mediaSession.setActionHandler("play", start); } catch(e){}
    try { navigator.mediaSession.setActionHandler("pause", stop); } catch(e){}
  }

  // Attempt autoplay; browser policy may require one tap.
  start();
})();
</script>
</body>
</html>
