<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>988 FM</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .app{width:min(720px,100vw);height:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5vh 6vw;gap:clamp(18px,4vh,38px)}
  .logo{width:min(52vw,310px);height:min(52vw,310px);object-fit:contain;display:block}
  .status{font-size:clamp(18px,3vw,28px);font-weight:700;letter-spacing:.08em}
  .status.live{color:#ff2d55}
  .status.connecting{color:#aaa}
  .status.error{color:#ff7a7a}
  .station{font-size:clamp(20px,3.5vw,30px);font-weight:600;margin-top:-12px}
  button{border:0;border-radius:999px;width:clamp(150px,30vw,220px);height:clamp(70px,14vw,96px);font-size:clamp(22px,4vw,32px);font-weight:800;background:#fff;color:#050505;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.97)}
  .hint{font-size:clamp(13px,2.2vw,17px);color:#777;text-align:center;max-width:520px;line-height:1.4}
  .hidden{display:none}
</style>
</head>
<body>
<main class="app" aria-label="988 FM player">
  <img class="logo" src="988-logo-original.png" alt="988">
  <div id="status" class="status connecting">CONNECTING…</div>
  <div class="station">988 FM</div>
  <button id="play" type="button">▶ PLAY</button>
  <div id="hint" class="hint">If Tesla blocks automatic playback, tap PLAY once.</div>
  <audio id="audio" preload="none" playsinline></audio>
</main>

<script>
(() => {
  const STREAM = "https://28103.live.streamtheworld.com/988_FMAAC.aac";
  const audio = document.getElementById("audio");
  const play = document.getElementById("play");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");

  audio.src = STREAM;

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = "status " + (cls || "");
  }

  function setPlayingUI(on) {
    play.textContent = on ? "❚❚ PAUSE" : "▶ PLAY";
  }

  async function start() {
    setStatus("CONNECTING…", "connecting");
    try {
      await audio.play();
      setPlayingUI(true);
      setStatus("● LIVE", "live");
      hint.textContent = "Playing 988 FM";
    } catch (e) {
      setPlayingUI(false);
      setStatus("● READY", "");
      hint.textContent = "Tap PLAY once to start 988 FM.";
    }
  }

  function stop() {
    audio.pause();
    setPlayingUI(false);
    setStatus("PAUSED", "");
    hint.textContent = "Tap PLAY to resume 988 FM.";
  }

  play.addEventListener("click", () => {
    if (audio.paused) start(); else stop();
  });

  audio.addEventListener("playing", () => {
    setPlayingUI(true);
    setStatus("● LIVE", "live");
    hint.textContent = "Playing 988 FM";
  });

  audio.addEventListener("waiting", () => {
    if (!audio.paused) setStatus("BUFFERING…", "connecting");
  });

  audio.addEventListener("stalled", () => {
    if (!audio.paused) reconnect();
  });

  audio.addEventListener("error", () => {
    if (!audio.paused) reconnect();
  });

  let reconnectTimer = null;
  let reconnectDelay = 1500;

  async function reconnect() {
    clearTimeout(reconnectTimer);
    setStatus("RECONNECTING…", "connecting");
    reconnectTimer = setTimeout(async () => {
      try {
        audio.load();
        await audio.play();
        reconnectDelay = 1500;
      } catch (e) {
        reconnectDelay = Math.min(reconnectDelay * 2, 15000);
        reconnect();
      }
    }, reconnectDelay);
  }

  audio.addEventListener("pause", () => {
    if (!audio.ended) setPlayingUI(false);
  });

  // Tesla/Browser Media Miniplayer integration where supported.
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: "988 FM",
      artist: "988 FM Malaysia",
      album: "Live Radio"
    });
    navigator.mediaSession.setActionHandler("play", start);
    navigator.mediaSession.setActionHandler("pause", stop);
  }

  // Try autoplay immediately. If the browser blocks it, the large PLAY button remains.
  start();
})();
</script>
</body>
</html>
